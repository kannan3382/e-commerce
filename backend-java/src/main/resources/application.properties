# Server Port
server.port=8080

# Spring Application Name
spring.application.name=aura-ecommerce-backend

# Database Configuration (PostgreSQL / H2 Fallback)
# For production PostgreSQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/aura_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Default out-of-the-box persistent H2 database (zero setup required to run immediately)
spring.datasource.url=jdbc:h2:mem:auradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate JPA auto-generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS configuration
aura.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
